name: Spoke Terraform

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform
  TF_VERSION: 1.13.4

jobs:

  # =========================================================
  # 1. VALIDATE
  # =========================================================
  validate:
    name: Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate


  # =========================================================
  # 2. PLAN
  # =========================================================
  plan:
    name: Terraform Plan - Spoke
    needs: validate

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------------------------------
      # AWS SPOKE ACCOUNT
      # -----------------------------------------------------
      - name: Configure AWS Credentials - Spoke
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Account
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          echo "Connected AWS Account: $ACCOUNT_ID"

          if [ "$ACCOUNT_ID" != "434097521299" ]; then
            echo "ERROR: Wrong AWS account!"
            echo "Expected: 434097521299"
            echo "Actual:   $ACCOUNT_ID"
            exit 1
          fi

          echo "SUCCESS: Connected to Spoke account."

      # -----------------------------------------------------
      # CHECK SECRETS
      # -----------------------------------------------------
      - name: Check Required Secrets
        env:
          TG_TRANSIT_GATEWAY_ID: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          RAM_RESOURCE_SHARE_ARN: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
        run: |
          if [ -z "$TG_TRANSIT_GATEWAY_ID" ]; then
            echo "ERROR: TG_TRANSIT_GATEWAY_ID secret is missing."
            exit 1
          fi

          if [ -z "$RAM_RESOURCE_SHARE_ARN" ]; then
            echo "ERROR: RAM_RESOURCE_SHARE_ARN secret is missing."
            exit 1
          fi

          echo "Required secrets are present."

      # -----------------------------------------------------
      # TERRAFORM INIT
      # -----------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # -----------------------------------------------------
      # TERRAFORM PLAN
      # -----------------------------------------------------
      - name: Terraform Plan
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "false"

          TF_VAR_subnets: |
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }

        run: terraform plan -input=false -out=tfplan

      # -----------------------------------------------------
      # UPLOAD PLAN
      # -----------------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: spoke-terraform-plan
          path: terraform/tfplan
          retention-days: 1


  # =========================================================
  # 3. APPLY
  # =========================================================
  apply:
    name: Terraform Apply - Spoke
    needs: plan

    # Apply ONLY from main branch
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------------------------------
      # AWS SPOKE ACCOUNT
      # -----------------------------------------------------
      - name: Configure AWS Credentials - Spoke
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------
      # VERIFY WE ARE IN SPOKE ACCOUNT
      # -----------------------------------------------------
      - name: Verify AWS Account
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          echo "Connected AWS Account: $ACCOUNT_ID"

          if [ "$ACCOUNT_ID" != "434097521299" ]; then
            echo "ERROR: WRONG AWS ACCOUNT!"
            echo "Expected: 434097521299"
            echo "Actual:   $ACCOUNT_ID"
            exit 1
          fi

          echo "SUCCESS: Applying to Spoke account."

      # -----------------------------------------------------
      # TERRAFORM INIT
      # -----------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # -----------------------------------------------------
      # DOWNLOAD PLAN
      # -----------------------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: spoke-terraform-plan
          path: terraform

      # -----------------------------------------------------
      # APPLY
      # -----------------------------------------------------
      - name: Terraform Apply
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "false"

          TF_VAR_subnets: |
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }

        run: terraform apply -input=false -auto-approve tfplan 