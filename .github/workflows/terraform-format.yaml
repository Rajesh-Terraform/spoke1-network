name: Spoke Terraform Destroy

on:

  push:
    branches:
      - main
   
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type DESTROY to confirm deletion of spoke resources'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform
  TF_VERSION: 1.13.4

jobs:
  destroy:
    name: Destroy Spoke VPC and Endpoints
    runs-on: ubuntu-latest

    # Run only for a manual dispatch on main with explicit confirmation.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_destroy == 'DESTROY'

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          aws sts get-caller-identity
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          if [[ "$ACCOUNT_ID" != "434097521299" ]]; then
            echo "ERROR: Connected to unexpected AWS account: $ACCOUNT_ID"
            exit 1
          fi

      - name: Check required GitHub secrets
        env:
          TG_TRANSIT_GATEWAY_ID: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          RAM_RESOURCE_SHARE_ARN: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
        run: |
          if [[ -z "$TG_TRANSIT_GATEWAY_ID" ]]; then
            echo "ERROR: Missing TG_TRANSIT_GATEWAY_ID secret."
            exit 1
          fi

          if [[ -z "$RAM_RESOURCE_SHARE_ARN" ]]; then
            echo "ERROR: Missing RAM_RESOURCE_SHARE_ARN secret."
            exit 1
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Create destroy plan
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "false"
          TF_VAR_subnets: >-
            {"private_1":{"cidr_block":"10.1.0.0/24","availability_zone":"ap-south-1a","public":false},"private_2":{"cidr_block":"10.1.1.0/24","availability_zone":"ap-south-1b","public":false}}
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Apply destroy plan
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "false"
          TF_VAR_subnets: >-
            {"private_1":{"cidr_block":"10.1.0.0/24","availability_zone":"ap-south-1a","public":false},"private_2":{"cidr_block":"10.1.1.0/24","availability_zone":"ap-south-1b","public":false}}
        run: terraform apply -auto-approve destroy.tfplan    