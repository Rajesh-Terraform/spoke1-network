
name: Spoke Terraform Destroy


on:
  push:
    branches:
      - main


  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm deletion of spoke infrastructure"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: spoke-terraform-destroy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform
  TF_VERSION: "1.13.4"

jobs:
  destroy:
    name: Destroy Spoke Infrastructure
    runs-on: ubuntu-latest

    if: ${{ inputs.confirm_destroy == 'DESTROY' }}

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Authenticate to the Spoke AWS account using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      # Verify the AWS account before deleting anything
      - name: Verify AWS account
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          echo "Authenticated AWS account: $ACCOUNT_ID"

          if [[ "$ACCOUNT_ID" != "434097521299" ]]; then
            echo "::error::Incorrect AWS account. Destroy cancelled."
            exit 1
          fi

      # Confirm the destructive action
      - name: Confirm destroy request
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRM_DESTROY" != "DESTROY" ]]; then
            echo "::error::You must type DESTROY to continue."
            exit 1
          fi

          echo "Destroy confirmation accepted."

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # Show the resources Terraform plans to destroy
      - name: Terraform Destroy Plan
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "false"
          TF_VAR_subnets: |
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      # Destroy the spoke resources
      - name: Terraform Destroy
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "false"
          TF_VAR_subnets: |
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }
        run: terraform apply -input=false -auto-approve destroy.tfplan    
