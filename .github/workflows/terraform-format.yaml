name: Terraform AWS CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      # 4. Check AWS identity
      - name: Check AWS identity
        working-directory: .
        run: |
          aws sts get-caller-identity

      # 5. Check Terraform structure
      - name: Check Terraform files
        working-directory: .
        run: |
          echo "===== Terraform directory ====="
          find terraform -maxdepth 3 -type f | sort

          echo ""
          echo "===== Terraform modules ====="
          find terraform/modules -maxdepth 3 -type f | sort

      # 6. Terraform Format
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 7. Terraform Init
      - name: Terraform Init
        run: terraform init -input=false

      # 8. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 9. Terraform Plan
      - name: Terraform Plan
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_subnets: >-
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "az": "ap-south-1a"
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "az": "ap-south-1b"
              }
            }
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # 10. Terraform Apply
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan  