name: Spoke Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

  plan:
    name: Plan in spoke account
    needs: validate
    if: github.event_name != 'pull_request' 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure AWS credentials in spoke account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account_id" != "434097521299" ]; then
            echo "Expected spoke account 434097521299, got $account_id" >&2
            exit 1
          fi

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Check required Terraform secrets
        env:
          TG_TRANSIT_GATEWAY_ID: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          RAM_RESOURCE_SHARE_ARN: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}  
        run: |
          if [ -z "$TG_TRANSIT_GATEWAY_ID" ]; then
            echo "::error::Repository secret TG_TRANSIT_GATEWAY_ID is not set."
            exit 1
          fi
          if [ -z "$RAM_RESOURCE_SHARE_ARN" ]; then
            echo "::error::Repository secret RAM_RESOURCE_SHARE_ARN is not set."
            exit 1
          fi

      - name: Plan Terraform changes
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_subnets: >-
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }
        run: terraform plan -input=false -out=tfplan

      - name: Apply Terraform changes
        if: github.ref == 'refs/heads/main' && vars.TF_APPLY_ENABLED == 'true'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Keep apply disabled until explicitly enabled
        if: github.ref == 'refs/heads/main' && vars.TF_APPLY_ENABLED != 'true'
        run: echo "Terraform apply skipped. Set the repository variable TF_APPLY_ENABLED to true after reviewing the plan and confirming state is reconciled."
