name: Spoke Terraform

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform
  TF_VERSION: "1.13.4"

jobs:

  # --------------------------------------------------
  # JOB 1: TERRAFORM VALIDATE
  # --------------------------------------------------
  validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate


  # --------------------------------------------------
  # JOB 2: TERRAFORM PLAN
  # --------------------------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------
      # Authenticate to Spoke AWS account using OIDC
      # ----------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------
      # Confirm that GitHub authenticated to Spoke
      # ----------------------------------------------
      - name: Verify AWS account
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          echo "Authenticated AWS account: $ACCOUNT_ID"

          if [[ "$ACCOUNT_ID" != "434097521299" ]]; then
            echo "::error::Incorrect AWS account. Expected Spoke account 434097521299."
            exit 1
          fi

      # ----------------------------------------------
      # Check required GitHub repository secrets
      # ----------------------------------------------
      - name: Check required secrets
        env:
          TG_TRANSIT_GATEWAY_ID: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          RAM_RESOURCE_SHARE_ARN: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "$TG_TRANSIT_GATEWAY_ID" ]]; then
            echo "::error::Missing TG_TRANSIT_GATEWAY_ID repository secret."
            exit 1
          fi

          if [[ -z "$RAM_RESOURCE_SHARE_ARN" ]]; then
            echo "::error::Missing RAM_RESOURCE_SHARE_ARN repository secret."
            exit 1
          fi

          echo "Required repository secrets are configured."

      # ----------------------------------------------
      # Initialize Terraform
      # ----------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # ----------------------------------------------
      # Create Terraform plan
      # ----------------------------------------------
      - name: Terraform Plan
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "true"
          TF_VAR_subnets: |
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }
        run: terraform plan -input=false -out=tfplan

      # ----------------------------------------------
      # Upload the saved plan
      # ----------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: spoke-terraform-plan
          path: terraform/tfplan
          retention-days: 1


  # --------------------------------------------------
  # JOB 3: TERRAFORM APPLY
  # --------------------------------------------------
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan

    # Apply only on pushes to main, not pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------
      # Authenticate to Spoke AWS account using OIDC
      # ----------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------
      # Verify the AWS account
      # ----------------------------------------------
      - name: Verify AWS account
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          echo "Authenticated AWS account: $ACCOUNT_ID"

          if [[ "$ACCOUNT_ID" != "434097521299" ]]; then
            echo "::error::Incorrect AWS account. Expected Spoke account 434097521299."
            exit 1
          fi

      # ----------------------------------------------
      # Check required secrets
      # ----------------------------------------------
      - name: Check required secrets
        env:
          TG_TRANSIT_GATEWAY_ID: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          RAM_RESOURCE_SHARE_ARN: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "$TG_TRANSIT_GATEWAY_ID" ]]; then
            echo "::error::Missing TG_TRANSIT_GATEWAY_ID repository secret."
            exit 1
          fi

          if [[ -z "$RAM_RESOURCE_SHARE_ARN" ]]; then
            echo "::error::Missing RAM_RESOURCE_SHARE_ARN repository secret."
            exit 1
          fi

          echo "Required repository secrets are configured."

      # ----------------------------------------------
      # Initialize Terraform
      # ----------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # ----------------------------------------------
      # Download the exact plan created by the Plan job
      # ----------------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: spoke-terraform-plan
          path: terraform

      # ----------------------------------------------
      # Apply the saved Terraform plan
      # ----------------------------------------------
      - name: Terraform Apply
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "true"
          TF_VAR_subnets: |
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }
        run: terraform apply -input=false -auto-approve tfplan