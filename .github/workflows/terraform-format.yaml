name: Spoke Terraform

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform
  TF_VERSION: 1.13.4

jobs:

  # ============================================================
  # JOB 1 - FORMAT + VALIDATE
  # ============================================================
  validate:
    name: Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate


  # ============================================================
  # JOB 2 - PLAN
  # ============================================================
  plan:
    name: Terraform Plan - Spoke
    needs: validate

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS Account
      # --------------------------------------------------------
      - name: Verify AWS account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "AWS Account: $ACCOUNT_ID"

          if [ "$ACCOUNT_ID" != "434097521299" ]; then
            echo "::error::Wrong AWS account. Expected 434097521299 but got $ACCOUNT_ID"
            exit 1
          fi

      # --------------------------------------------------------
      # Check Secrets
      # --------------------------------------------------------
      - name: Check required Terraform secrets
        env:
          TG_TRANSIT_GATEWAY_ID: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          RAM_RESOURCE_SHARE_ARN: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
        run: |
          if [ -z "$TG_TRANSIT_GATEWAY_ID" ]; then
            echo "::error::TG_TRANSIT_GATEWAY_ID secret is missing"
            exit 1
          fi

          if [ -z "$RAM_RESOURCE_SHARE_ARN" ]; then
            echo "::error::RAM_RESOURCE_SHARE_ARN secret is missing"
            exit 1
          fi

          echo "Required Terraform secrets are available."

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------
      - name: Terraform Plan
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}

          TF_VAR_subnets: >-
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }

        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # --------------------------------------------------------
      # Upload Plan
      # --------------------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: spoke-terraform-plan
          path: terraform/tfplan
          retention-days: 5


  # ============================================================
  # JOB 3 - APPLY
  # ============================================================
  apply:
    name: Terraform Apply - Spoke
    needs: plan

    if: >
      github.ref == 'refs/heads/main' &&
      vars.TF_APPLY_ENABLED == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS Account
      # --------------------------------------------------------
      - name: Verify AWS account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "AWS Account: $ACCOUNT_ID"

          if [ "$ACCOUNT_ID" != "434097521299" ]; then
            echo "::error::Wrong AWS account. Expected 434097521299 but got $ACCOUNT_ID"
            exit 1
          fi

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------------
      # Download Plan
      # --------------------------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: spoke-terraform-plan
          path: terraform

      # --------------------------------------------------------
      # Apply
      # --------------------------------------------------------
      - name: Terraform Apply
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}

          TF_VAR_subnets: >-
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }

        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan 