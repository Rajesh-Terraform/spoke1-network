
name: Spoke Terraform Destroy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to delete spoke infrastructure and VPC endpoints"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: spoke-terraform-destroy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_VERSION: "1.13.4"

jobs:
  destroy:
    name: Destroy Spoke VPC and Endpoints
    runs-on: ubuntu-latest

    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_destroy == 'DESTROY'

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      # --------------------------------------------------
      # STEP 1: CHECKOUT REPOSITORY
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # STEP 2: INSTALL TERRAFORM
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------
      # STEP 3: AUTHENTICATE TO SPOKE AWS ACCOUNT
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # STEP 4: VERIFY AWS ACCOUNT
      # --------------------------------------------------
      - name: Verify AWS account
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          echo "Authenticated AWS account: $ACCOUNT_ID"

          if [[ "$ACCOUNT_ID" != "434097521299" ]]; then
            echo "::error::Incorrect AWS account. Destroy cancelled."
            exit 1
          fi

      # --------------------------------------------------
      # STEP 5: VERIFY CONFIRMATION
      # --------------------------------------------------
      - name: Confirm destroy request
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRM_DESTROY" != "DESTROY" ]]; then
            echo "::error::Confirmation must be DESTROY."
            exit 1
          fi

          echo "Destroy confirmation accepted."

      # --------------------------------------------------
      # STEP 6: INITIALIZE TERRAFORM
      # --------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------
      # STEP 7: VALIDATE TERRAFORM CONFIGURATION
      # --------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------
      # STEP 8: GENERATE DESTROY PLAN
      # --------------------------------------------------
      - name: Terraform Destroy Plan
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "false"
          TF_VAR_subnets: |
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      # --------------------------------------------------
      # STEP 9: UPLOAD DESTROY PLAN
      # --------------------------------------------------
      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: spoke-destroy-plan
          path: terraform/destroy.tfplan
          retention-days: 1

      # --------------------------------------------------
      # STEP 10: APPLY DESTROY PLAN
      # --------------------------------------------------
      - name: Terraform Destroy
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TG_TRANSIT_GATEWAY_ID }}
          TF_VAR_ram_resource_share_arn: ${{ secrets.RAM_RESOURCE_SHARE_ARN }}
          TF_VAR_accept_ram_share_invitation: "false"
          TF_VAR_subnets: |
            {
              "private_1": {
                "cidr_block": "10.1.0.0/24",
                "availability_zone": "ap-south-1a",
                "public": false
              },
              "private_2": {
                "cidr_block": "10.1.1.0/24",
                "availability_zone": "ap-south-1b",
                "public": false
              }
            }
        run: terraform apply -input=false -auto-approve destroy.tfplan

      # --------------------------------------------------
      # STEP 11: REPORT COMPLETION
      # --------------------------------------------------
      - name: Destroy completed
        if: success()
        run: |
          echo "Terraform destroy completed successfully."
          echo "Check the AWS VPC console to verify endpoint deletion." 
  